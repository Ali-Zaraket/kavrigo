[project]
name = "kavrigo-model-gateway"
version = "0.1.0"
description = "Provider-neutral, bounded, validated model calls for Kavrigo"
requires-python = ">=3.13"
dependencies = ["kavrigo-domain", "opentelemetry-api>=1.39,<2", "structlog>=24.4"]

[tool.uv.sources]
kavrigo-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_model_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_model_gateway/py.typed" = "kavrigo_model_gateway/py.typed"
