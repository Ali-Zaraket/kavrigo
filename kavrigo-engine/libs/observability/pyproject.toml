[project]
name = "kavrigo-observability"
version = "0.1.0"
description = "Content-free OTel service bootstrap for Kavrigo"
requires-python = ">=3.13"
dependencies = ["opentelemetry-sdk>=1.44,<2", "opentelemetry-exporter-otlp-proto-http>=1.44,<2", "pydantic>=2.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_observability"]
