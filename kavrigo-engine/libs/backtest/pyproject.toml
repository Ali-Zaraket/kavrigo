[project]
name = "kavrigo-backtest"
version = "0.1.0"
description = "Kavrigo backtest contracts: dataset manifests, cost models, metrics, reproducibility"
requires-python = ">=3.13"
dependencies = [
  "kavrigo-domain",
]

[tool.uv.sources]
kavrigo-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_backtest"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_backtest/py.typed" = "kavrigo_backtest/py.typed"
