[project]
name = "kavrigo-marketdata"
version = "0.1.0"
description = "Kavrigo market-data adapters, normalization and stream health"
requires-python = ">=3.13"
dependencies = [
  "kavrigo-domain",
  "structlog>=24.4",
]

[tool.uv.sources]
kavrigo-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_marketdata"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_marketdata/py.typed" = "kavrigo_marketdata/py.typed"
