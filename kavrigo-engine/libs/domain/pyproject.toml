[project]
name = "kavrigo-domain"
version = "0.1.0"
description = "Kavrigo domain contracts: identifiers, money, events, evidence, decisions, risk, orders"
requires-python = ">=3.13"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_domain"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_domain/py.typed" = "kavrigo_domain/py.typed"
