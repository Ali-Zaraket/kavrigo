[project]
name = "kavrigo-engine-worker"
version = "0.1.0"
description = "Kavrigo engine worker (placeholder: ingestion, features, agent runtime land here)"
requires-python = ">=3.13"
dependencies = [
  "kavrigo-domain",
  "structlog>=24.4",
]

[tool.uv.sources]
kavrigo-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_engine_worker"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_engine_worker/py.typed" = "kavrigo_engine_worker/py.typed"
