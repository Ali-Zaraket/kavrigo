[project]
name = "kavrigo-workflows"
version = "0.1.0"
description = "Durable paper account receipts and Temporal business workflows"
requires-python = ">=3.13"
dependencies = [
  "kavrigo-domain", "kavrigo-risk", "kavrigo-paper", "kavrigo-runtime",
  "kavrigo-backtest", "kavrigo-model-gateway", "sqlalchemy[asyncio]>=2.0", "asyncpg>=0.30",
  "temporalio[opentelemetry]==1.32.0", "structlog>=24.4",
]

[tool.uv.sources]
kavrigo-domain = { workspace = true }
kavrigo-risk = { workspace = true }
kavrigo-paper = { workspace = true }
kavrigo-runtime = { workspace = true }
kavrigo-backtest = { workspace = true }
kavrigo-model-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_workflows"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_workflows/py.typed" = "kavrigo_workflows/py.typed"
