[project]
name = "kavrigo-market-ingestion"
version = "0.1.0"
description = "Kavrigo market ingestion: venue streams to normalized events, health and sinks"
requires-python = ">=3.13"
dependencies = [
  "kavrigo-domain",
  "kavrigo-marketdata",
  "httpx>=0.28",
  "orjson>=3.10",
  "structlog>=24.4",
]

[tool.uv.sources]
kavrigo-domain = { workspace = true }
kavrigo-marketdata = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_market_ingestion"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_market_ingestion/py.typed" = "kavrigo_market_ingestion/py.typed"
