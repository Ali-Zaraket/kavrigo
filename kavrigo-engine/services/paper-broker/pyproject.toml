[project]
name = "kavrigo-paper"
version = "0.1.0"
description = "Deterministic local paper fills, accounting, replay and reconciliation"
requires-python = ">=3.13"
dependencies = ["kavrigo-domain", "kavrigo-risk", "opentelemetry-api>=1.39,<2", "structlog>=24.4"]

[tool.uv.sources]
kavrigo-domain = { workspace = true }
kavrigo-risk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_paper"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_paper/py.typed" = "kavrigo_paper/py.typed"
