[project]
name = "kavrigo-risk"
version = "0.1.0"
description = "Deterministic local paper risk evaluation and reservation gate"
requires-python = ">=3.13"
dependencies = ["kavrigo-domain", "kavrigo-runtime", "opentelemetry-api>=1.39,<2", "structlog>=24.4"]

[tool.uv.sources]
kavrigo-domain = { workspace = true }
kavrigo-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_risk"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_risk/py.typed" = "kavrigo_risk/py.typed"
