[project]
name = "kavrigo-runtime"
version = "0.1.0"
description = "Kavrigo bounded local decision runtime and portfolio proposals"
requires-python = ">=3.13"
dependencies = ["kavrigo-domain", "kavrigo-model-gateway", "opentelemetry-api>=1.39,<2", "structlog>=24.4"]

[tool.uv.sources]
kavrigo-domain = { workspace = true }
kavrigo-model-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_runtime"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_runtime/py.typed" = "kavrigo_runtime/py.typed"
