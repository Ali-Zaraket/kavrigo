# Alembic configuration for the Kavrigo control plane.
#
# The database URL is NOT stored here. It is read from POSTGRES_DSN at runtime by migrations/env.py
# so that a connection string never lands in version control (SECURITY.md).

[alembic]
script_location = migrations
prepend_sys_path = src
version_path_separator = os
timezone = UTC
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
