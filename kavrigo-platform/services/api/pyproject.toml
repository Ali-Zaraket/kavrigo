[project]
name = "kavrigo-api"
version = "0.1.0"
description = "Kavrigo control-plane API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
  "kavrigo-domain",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.34",
  "structlog>=24.4",
]

[tool.uv.sources]
kavrigo-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_api/py.typed" = "kavrigo_api/py.typed"
