[project]
name = "kavrigo-api"
version = "0.1.0"
description = "Kavrigo control-plane API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
  "kavrigo-domain",
  "kavrigo-model-gateway",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "uvicorn[standard]>=0.34",
  "structlog>=24.4",
  # Required by the already-implemented DB/auth modules. A developer's populated venv
  # masked these missing runtime declarations; a clean container must install them too.
  "sqlalchemy[asyncio]>=2.0.52,<3",
  "asyncpg>=0.31,<1",
  "alembic>=1.19.2,<2",
  "pyjwt[crypto]>=2.13,<3",
  "httpx>=0.28,<1",
]

[tool.uv.sources]
kavrigo-domain = { workspace = true }
kavrigo-model-gateway = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kavrigo_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/kavrigo_api/py.typed" = "kavrigo_api/py.typed"
