# Kavrigo secret-scanning configuration.
title = "kavrigo"

[extend]
useDefault = true

[[rules]]
id = "kavrigo-exchange-credential"
description = "Possible exchange API credential"
regex = '''(?i)(binance|coinbase|kraken|bybit|okx)[_-]?(api)?[_-]?(key|secret)\s*[:=]\s*['"][0-9a-zA-Z/+=]{16,}['"]'''
tags = ["exchange", "credential"]

[[rules]]
id = "kavrigo-private-key-material"
description = "Private key material"
regex = '''-----BEGIN (RSA |EC |OPENSSH |PGP )?PRIVATE KEY( BLOCK)?-----'''
tags = ["key"]

[[rules]]
id = "kavrigo-seed-phrase-hint"
description = "Possible wallet seed phrase assignment"
regex = '''(?i)(mnemonic|seed[_-]?phrase|recovery[_-]?phrase)\s*[:=]\s*['"](\w+\s+){11,}\w+['"]'''
tags = ["wallet"]

[[allowlists]]
description = "Placeholders and documentation"
paths = [
  '''\.env\.example$''',
  '''\.gitleaks\.toml$''',
  '''MASTER_BUILD_SPEC\.md$''',
]
regexes = [
  '''replace_me''',
  '''kavrigo_local_dev''',
]

[[allowlists]]
description = "Documented BuildKit environment variable name, not a key value"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "line"
paths = ['''^kavrigo-infra/images/README\.md$''']
regexes = ['''^\s*--secret id=clerk_secret_key,env=CLERK_SECRET_KEY \\$''']
